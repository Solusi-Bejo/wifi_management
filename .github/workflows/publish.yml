# Publishes to pub.dev when a version tag is pushed. Requires automated
# publishing to be enabled for this repository on pub.dev (package admin page)
# after the first manual `dart pub publish`.
name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
