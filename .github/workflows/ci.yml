name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze + test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pinned) and the latest stable (no version = latest).
        include:
          - flutter: '3.41.4'
            version: '3.41.4'
          - flutter: 'stable'
            version: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example

  build-android:
    name: Example APK (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example
      - run: ./gradlew :wifi_management:testDebugUnitTest
        working-directory: example/android

  build-ios:
    name: Example iOS simulator (stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
