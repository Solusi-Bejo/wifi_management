name: wifi_management
description: >-
  Pin an Android device to one exact Wi-Fi router (SSID + BSSID): scan, join,
  verify the BSSID, bind the app's traffic, remember it and reconnect with
  backoff. Best-effort join + BSSID check on iOS.
version: 0.1.0
homepage: https://github.com/Solusi-Bejo/wifi_management
repository: https://github.com/Solusi-Bejo/wifi_management
issue_tracker: https://github.com/Solusi-Bejo/wifi_management/issues
topics:
  - wifi
  - bssid
  - network
  - android

environment:
  # Kept low on purpose: apps still on Flutter 3.41 (Dart 3.11) must resolve
  # this plugin; there is no upper Flutter bound.
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  meta: ^1.15.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  build_runner: ^2.11.1
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ">=3.2.5 <5.0.0"
  json_serializable: ^6.12.0
  # 27.x is the newest that resolves on Flutter 3.41 (meta pin); 30.x on 3.50.
  pigeon: ">=27.3.0 <31.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.solusibejo.wifi_management
        pluginClass: WifiManagementPlugin
      ios:
        pluginClass: WifiManagementPlugin
